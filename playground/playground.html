<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Playground - BitWiseBrain</title>
    <link rel="stylesheet" href="../../styles-login-signup.css">
    <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>
    <style>
        /* Code Playground Styles */
        body {
            background-image: url('../../assets/img/login-signup-BG.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .playground-title {
            text-align: center;
            color: #1ec8ff;
            font-size: 35px;
            font-family: Arial;
            padding: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            background-color: rgba(0, 0, 0, 0.5);
            margin: 0;
            margin-bottom: 20px;
        }

        .playground-container {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            min-height: calc(100vh - 80px);
        }

        .editor-container {
            display: flex;
            gap: 20px;
            margin: 20px auto;
            max-width: 1400px;
            height: calc(100vh - 200px);
        }

        .code-panel {
            width: 50%;
            background: #282c34;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .output-panel {
            width: 50%;
            background: #282c34;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .tab-buttons {
            display: flex;
            background: #21252b;
            border-bottom: 1px solid #3e4451;
        }

        .tab-button {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: #abb2bf;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-button.active {
            color: #1ec8ff;
            border-bottom: 3px solid #1ec8ff;
            background: rgba(30, 200, 255, 0.05);
        }

        .code-editor {
            flex: 1;
            display: none;
            height: 100%;
        }

        .code-editor.active {
            display: block;
        }

        .code {
            width: 100%;
            height: 100%;
            background: #282c34;
            color: #abb2bf;
            font-family: 'Consolas', 'Monaco', monospace;
            border: none;
            padding: 15px;
            resize: none;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #21252b;
            padding: 10px 15px;
            border-bottom: 1px solid #3e4451;
        }

        .panel-title {
            color: #abb2bf;
            font-size: 16px;
            font-weight: bold;
        }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            background: white;
            border: none;
        }

        .run-btn {
            background: #1ec8ff;
            color: white;
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .run-btn:hover {
            background: #19b8e6;
            transform: translateY(-2px);
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            position: absolute;
            top: 20px;
            left: 20px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 10;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .keyboard-shortcut {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        /* Custom checkbox styling */
        .autorun-container {
            display: flex;
            align-items: center;
            margin-right: 15px;
        }

        .autorun-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .autorun-checkbox {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            position: relative;
            display: inline-block;
            height: 18px;
            width: 18px;
            background-color: #21252b;
            border: 2px solid rgba(30, 200, 255, 0.5);
            border-radius: 3px;
            margin-right: 8px;
            transition: all 0.2s ease;
        }

        .autorun-checkbox:checked ~ .checkmark {
            background-color: #1ec8ff;
            border-color: #1ec8ff;
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 5px;
            top: 1px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .autorun-checkbox:checked ~ .checkmark:after {
            display: block;
        }

        .controls-group {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='../assets/html/main.html'">
        <ion-icon name="arrow-back-outline"></ion-icon> Back
    </button>

    <div class="playground-container">
        <h1 class="playground-title">Code Playground</h1>
        <div class="editor-container">
            <!-- Code Panel -->
            <div class="code-panel">
                <div class="tab-buttons">
                    <button class="tab-button active" data-tab="html">HTML</button>
                    <button class="tab-button" data-tab="css">CSS</button>
                    <button class="tab-button" data-tab="js">JavaScript</button>
                </div>
                
                <div class="code-editor active" id="html-editor">
                    <textarea id="html-code" class="code" placeholder="Write HTML here..."></textarea>
                </div>
                
                <div class="code-editor" id="css-editor">
                    <textarea id="css-code" class="code" placeholder="Write CSS here..."></textarea>
                </div>
                
                <div class="code-editor" id="js-editor">
                    <textarea id="js-code" class="code" placeholder="Write JavaScript here..."></textarea>
                </div>
            </div>
            
            <!-- Output Panel -->
            <div class="output-panel">
                <div class="panel-header">
                    <span class="panel-title">Output</span>
                    <div class="controls-group">
                        <div class="autorun-container">
                            <label class="autorun-label">
                                <input type="checkbox" id="autorun" class="autorun-checkbox">
                                <span class="checkmark"></span>
                                Auto-run
                            </label>
                        </div>
                        <span class="keyboard-shortcut">Ctrl+Enter to run</span>
                        <button class="run-btn" onclick="runCode()">
                            <ion-icon name="play"></ion-icon> Run
                        </button>
                    </div>
                </div>
                <iframe id="output"></iframe>
            </div>
        </div>
    </div>

    <script src="playground.js"></script>
</body>
</html>
